<title>UZ Drive: Hill Adventure</title>
<style>
/* Layout: one full-viewport stage; the game canvas fills it, a centred card sits on top while loading. */
:root {
  --night: #0c1424;
  --panel: #172540;
  --panel-edge: #2f4772;
  --ink: #f4f7fb;
  --ink-dim: #9db0cc;
  --gas: #2bd576;
  --gas-ink: #06281a;
  --flame: #ff8a1f;
  --brake: #ff4d5a;
  --display: "Exo 2", "Avenir Next Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Exo 2", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  overflow: hidden;
  background: var(--night);
  color: var(--ink);
  font-family: var(--body);
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
#stage {
  position: relative;
  height: 100%;
  box-sizing: border-box;
  padding-left: env(safe-area-inset-left, 0px);
  padding-right: env(safe-area-inset-right, 0px);
  background: var(--night);
}
#canvas {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
  outline: none;
  background: var(--night);
}
.cover {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px;
  background:
    radial-gradient(120% 90% at 85% 0%, rgba(61, 139, 255, 0.22), transparent 60%),
    linear-gradient(180deg, #111c31 0%, var(--night) 100%);
  overflow-y: auto;
}
.card {
  width: min(520px, 100%);
  display: grid;
  gap: 18px;
  padding: 26px 26px 22px;
  border: 2px solid var(--panel-edge);
  border-radius: 24px;
  background: color-mix(in srgb, var(--panel) 92%, transparent);
  box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
}
.logo { display: grid; gap: 8px; justify-items: start; }
.logo h1 {
  margin: 0;
  font-family: var(--display);
  font-style: italic;
  font-weight: 900;
  font-size: clamp(40px, 9vw, 64px);
  line-height: 0.95;
  letter-spacing: -0.01em;
  text-wrap: balance;
}
.logo h1 .uz { color: var(--flame); }
.logo .band {
  display: inline-block;
  padding: 4px 12px;
  background: var(--gas);
  color: var(--gas-ink);
  font-family: var(--display);
  font-weight: 800;
  font-size: 15px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.meter { display: grid; gap: 8px; }
.bar {
  height: 14px;
  border-radius: 7px;
  background: rgba(0, 0, 0, 0.4);
  overflow: hidden;
}
.bar > i {
  display: block;
  height: 100%;
  width: 0%;
  border-radius: 7px;
  background: linear-gradient(90deg, var(--gas), #9be564);
  transition: width 0.2s ease-out;
}
.status {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  font-size: 14px;
  color: var(--ink-dim);
  font-variant-numeric: tabular-nums;
}
#play {
  appearance: none;
  border: 0;
  border-bottom: 6px solid #d8590c;
  border-radius: 18px;
  padding: 16px 20px 12px;
  background: var(--flame);
  color: #fff;
  font-family: var(--display);
  font-style: italic;
  font-weight: 900;
  font-size: 30px;
  letter-spacing: 0.01em;
  cursor: pointer;
  touch-action: manipulation;
  transition: transform 0.08s ease-out, filter 0.15s;
}
#play:disabled { filter: grayscale(0.85) brightness(0.65); cursor: progress; }
#play:not(:disabled):active { transform: translateY(3px); border-bottom-width: 3px; }
#play:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.how {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 10px;
  font-size: 14px;
  color: var(--ink-dim);
}
.pedal {
  width: 34px;
  height: 42px;
  border-radius: 9px;
  border: 3px solid currentColor;
  display: grid;
  place-items: center;
  font-family: var(--display);
  font-weight: 800;
  font-size: 11px;
  letter-spacing: 0.04em;
}
.pedal.brake { color: var(--brake); }
.pedal.gas { color: var(--gas); }
.how p { margin: 0; text-align: center; min-width: 0; }
.notes { margin: 0; font-size: 12.5px; line-height: 1.45; color: var(--ink-dim); }
.notes kbd {
  font-family: var(--display);
  font-size: 11.5px;
  padding: 1px 6px;
  border: 1px solid var(--panel-edge);
  border-radius: 5px;
  color: var(--ink);
}
.error { color: #ffb3b9; font-size: 14px; line-height: 1.45; margin: 0; }
#rotate {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  align-content: center;
  gap: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px;
  text-align: center;
  background: rgba(12, 20, 36, 0.96);
  z-index: 5;
}
#rotate svg { width: 96px; height: 96px; }
#rotate h2 { margin: 0; font-family: var(--display); font-weight: 900; font-style: italic; font-size: 26px; text-wrap: balance; }
#rotate p { margin: 0; color: var(--ink-dim); font-size: 15px; max-width: 32ch; }
@media (prefers-reduced-motion: no-preference) {
  #rotate svg .phone { transform-origin: 48px 48px; animation: tilt 2.4s ease-in-out infinite; }
  @keyframes tilt { 0%, 30% { transform: rotate(0deg); } 55%, 85% { transform: rotate(-90deg); } 100% { transform: rotate(0deg); } }
}
@media (max-height: 430px) {
  .card { gap: 12px; padding: 18px 20px 16px; }
  .logo h1 { font-size: 40px; }
  #play { font-size: 24px; padding: 12px 16px 9px; }
}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,600;0,800;1,800;1,900&display=swap">

<div id="stage">
  <canvas id="canvas" tabindex="0" aria-label="UZ Drive game"></canvas>

  <div class="cover" id="cover">
    <div class="card">
      <div class="logo">
        <h1><span class="uz">UZ</span> DRIVE</h1>
        <span class="band" data-t="sub">Tepaliklar sarguzashti</span>
      </div>
      <div class="meter" id="meter">
        <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="bar"><i id="fill"></i></div>
        <div class="status"><span id="stage-label" data-t="loading">Yuklanmoqda…</span><span id="bytes">0 / __TOTAL_MB__ MB</span></div>
      </div>
      <button id="play" type="button" disabled data-t="play">Oʻynash</button>
      <div class="how">
        <span class="pedal brake" aria-hidden="true">B</span>
        <p data-t="how">Chap pedal — tormoz, oʻng pedal — gaz. Havoda shu pedallar bilan egiling.</p>
        <span class="pedal gas" aria-hidden="true">G</span>
      </div>
      <p class="notes" id="notes"></p>
      <p class="error" id="error" hidden></p>
    </div>
  </div>

  <div id="rotate" hidden>
    <svg viewBox="0 0 96 96" aria-hidden="true">
      <g class="phone"><rect x="30" y="14" width="36" height="68" rx="7" fill="none" stroke="#ff8a1f" stroke-width="5"/><circle cx="48" cy="73" r="3.5" fill="#ff8a1f"/></g>
    </svg>
    <h2 data-t="rotate">Telefonni yon tomonga burang</h2>
    <p data-t="rotate_sub">UZ Drive gorizontal holatda oʻynaladi.</p>
  </div>
</div>

<script>
/* Godot 4.7 web engine (single-threaded build), inlined so the page needs no other script host. */
__ENGINE_JS__
</script>
<script>
(function () {
  "use strict";
  var ENGINE_FILE = "engine.wasm";         // gzip-compressed uzdrive.wasm (decompressed below)
  var ENGINE_GZ_BYTES = __GZ_BYTES__;
  var WASM_BYTES = __WASM_BYTES__;
  var PCK_FILE = "uzdrive.pck";           // path inside the game's virtual file system
  var PCK_URL = "gamedata.wasm";          // served under a .wasm name; fetched as raw bytes
  var PCK_BYTES = __PCK_BYTES__;
  var PAKO = "https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js";

  var T = {
    uz: {
      sub: "Tepaliklar sarguzashti", loading: "Yuklanmoqda…", unpack: "Dvigatel tayyorlanmoqda…", ready: "Tayyor",
      play: "Oʻynash", starting: "Ishga tushmoqda…",
      how: "Chap pedal — tormoz, oʻng pedal — gaz. Havoda shu pedallar bilan egiling.",
      notes: "Progress shu brauzerda saqlanadi. Ovoz eshitilmasa, ovozsiz rejimni oʻchiring. Klaviatura: <kbd>→</kbd> gaz, <kbd>←</kbd> tormoz, <kbd>Space</kbd> turbo, <kbd>Esc</kbd> pauza.",
      rotate: "Telefonni yon tomonga burang", rotate_sub: "UZ Drive gorizontal holatda oʻynaladi.",
      fail: "Oʻyin bu brauzerda ishga tushmadi. iPhone’da iOS 16.4 yoki yangiroq Safari’dan, kompyuterda Chrome, Edge yoki Firefox’dan foydalaning.",
      net: "Yuklab boʻlmadi. Internetni tekshirib, sahifani yangilang."
    },
    ru: {
      sub: "Приключения на холмах", loading: "Загрузка…", unpack: "Подготовка движка…", ready: "Готово",
      play: "Играть", starting: "Запуск…",
      how: "Левая педаль — тормоз, правая — газ. В воздухе наклоняйте машину теми же педалями.",
      notes: "Прогресс сохраняется в этом браузере. Нет звука? Отключите беззвучный режим. Клавиатура: <kbd>→</kbd> газ, <kbd>←</kbd> тормоз, <kbd>Space</kbd> турбо, <kbd>Esc</kbd> пауза.",
      rotate: "Поверните телефон горизонтально", rotate_sub: "В UZ Drive играют в горизонтальном режиме.",
      fail: "Игра не запустилась в этом браузере. На iPhone используйте Safari на iOS 16.4 или новее, на компьютере — Chrome, Edge или Firefox.",
      net: "Не удалось загрузить. Проверьте интернет и обновите страницу."
    },
    en: {
      sub: "Hill Adventure", loading: "Downloading…", unpack: "Preparing the engine…", ready: "Ready",
      play: "Play", starting: "Starting…",
      how: "Left pedal brakes, right pedal is gas. In the air, the same pedals tilt the car.",
      notes: "Progress is saved in this browser. No sound? Turn off silent mode. Keyboard: <kbd>→</kbd> gas, <kbd>←</kbd> brake, <kbd>Space</kbd> boost, <kbd>Esc</kbd> pause.",
      rotate: "Turn your phone sideways", rotate_sub: "UZ Drive is played in landscape.",
      fail: "The game could not start in this browser. On iPhone use Safari on iOS 16.4 or newer; on a computer use Chrome, Edge or Firefox.",
      net: "The download failed. Check your connection and reload the page."
    }
  };
  var navLang = ((navigator.languages && navigator.languages[0]) || navigator.language || "en").toLowerCase();
  var L = navLang.indexOf("uz") === 0 ? T.uz : navLang.indexOf("ru") === 0 ? T.ru : T.en;
  document.documentElement.lang = L === T.uz ? "uz" : L === T.ru ? "ru" : "en";
  Array.prototype.forEach.call(document.querySelectorAll("[data-t]"), function (el) {
    var k = el.getAttribute("data-t");
    if (L[k]) el.textContent = L[k];
  });
  document.getElementById("notes").innerHTML = L.notes;

  var $ = function (id) { return document.getElementById(id); };
  var canvas = $("canvas"), cover = $("cover"), fill = $("fill"), bar = $("bar");
  var label = $("stage-label"), bytesEl = $("bytes"), playBtn = $("play"), errEl = $("error"), rotate = $("rotate");
  var started = false;

  function mb(n) { return (n / 1048576).toFixed(1); }
  var TOTAL = ENGINE_GZ_BYTES + PCK_BYTES;
  function progress(done, phaseLabel) {
    var pct = Math.max(0, Math.min(100, done));
    fill.style.width = pct.toFixed(1) + "%";
    bar.setAttribute("aria-valuenow", String(Math.round(pct)));
    if (phaseLabel) label.textContent = phaseLabel;
  }
  function fail(msg, err) {
    if (err) console.error(err);
    errEl.textContent = msg + (err && err.message ? "\n(" + err.message + ")" : "");
    errEl.hidden = false;
    playBtn.disabled = true;
    label.textContent = "";
  }

  /* Canvas size is managed here (resize policy 0): CSS size x devicePixelRatio,
     capped at 2x so phones with 3x screens keep 60 fps. */
  function fitCanvas() {
    var r = canvas.getBoundingClientRect();
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
    rotate.hidden = !(started && window.innerHeight > window.innerWidth * 1.05);
  }
  window.addEventListener("resize", fitCanvas);
  window.addEventListener("orientationchange", function () { setTimeout(fitCanvas, 250); });
  fitCanvas();

  /* Engine bytes are served from memory: the game asks for "uzdrive.wasm",
     this page hands over the decompressed module with the right MIME type. */
  var wasmBytes = null;
  var realFetch = window.fetch.bind(window);
  window.fetch = function (input, init) {
    var url = typeof input === "string" ? input : (input && input.url) || "";
    if (wasmBytes && /uzdrive\.wasm(\?|#|$)/.test(url)) {
      var body = wasmBytes;
      return Promise.resolve(new Response(body, { status: 200, headers: { "Content-Type": "application/wasm", "Content-Length": String(body.byteLength) } }));
    }
    return realFetch(input, init);
  };

  function download(url, expected, onBytes) {
    return realFetch(url, { credentials: "same-origin" }).then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status + " " + url);
      if (!res.body || !res.body.getReader) return res.arrayBuffer().then(function (b) { onBytes(b.byteLength); return new Uint8Array(b); });
      var reader = res.body.getReader(), chunks = [], got = 0;
      function pump() {
        return reader.read().then(function (r) {
          if (r.done) {
            var out = new Uint8Array(got), off = 0;
            chunks.forEach(function (c) { out.set(c, off); off += c.byteLength; });
            return out;
          }
          chunks.push(r.value); got += r.value.byteLength; onBytes(got);
          return pump();
        });
      }
      return pump();
    });
  }

  function loadScript(src) {
    return new Promise(function (ok, no) {
      var s = document.createElement("script");
      s.src = src; s.onload = ok; s.onerror = function () { no(new Error("script " + src)); };
      document.head.appendChild(s);
    });
  }

  function gunzip(u8) {
    var isGz = u8.length > 2 && u8[0] === 0x1f && u8[1] === 0x8b;
    if (!isGz) return Promise.resolve(u8);   // host already decoded it
    if (typeof DecompressionStream === "function") {
      var stream = new Blob([u8]).stream().pipeThrough(new DecompressionStream("gzip"));
      return new Response(stream).arrayBuffer().then(function (b) { return new Uint8Array(b); });
    }
    return loadScript(PAKO).then(function () { return window.pako.inflate(u8); });
  }

  var missing = Engine.getMissingFeatures({ threads: false });
  if (missing.length) { fail(L.fail + "\n" + missing.join(", ")); return; }

  var engine = new Engine({
    executable: "uzdrive",
    mainPack: PCK_FILE,
    canvas: canvas,
    canvasResizePolicy: 0,
    focusCanvas: true,
    args: [],
    fileSizes: { "uzdrive.pck": PCK_BYTES, "uzdrive.wasm": WASM_BYTES },
    ensureCrossOriginIsolationHeaders: false,
    experimentalVK: false,
    emscriptenPoolSize: 8,
    godotPoolSize: 4,
    gdextensionLibs: [],
    onPrintError: function () { console.warn.apply(console, arguments); }
  });

  var engineDone = 0, pckDone = 0;
  function showBytes() {
    bytesEl.textContent = mb(engineDone + pckDone) + " / " + mb(TOTAL) + " MB";
    progress((engineDone + pckDone) / TOTAL * 85);
  }
  progress(0, L.loading);

  var pckPromise = engine.preloadFile(PCK_URL, PCK_FILE);
  var pckTicker = setInterval(function () { if (pckDone < PCK_BYTES) { pckDone = Math.min(PCK_BYTES, pckDone + PCK_BYTES / 20); showBytes(); } }, 120);

  download(ENGINE_FILE, ENGINE_GZ_BYTES, function (n) { engineDone = n; showBytes(); })
    .then(function (gz) {
      progress(88, L.unpack);
      return gunzip(gz);
    })
    .then(function (wasm) {
      wasmBytes = wasm;
      progress(93, L.unpack);
      return Promise.all([engine.init("uzdrive"), pckPromise]);
    })
    .then(function () {
      clearInterval(pckTicker);
      pckDone = PCK_BYTES; showBytes();
      wasmBytes = null;
      progress(100, L.ready);
      playBtn.disabled = false;
      playBtn.focus({ preventScroll: true });
    })
    .catch(function (e) {
      clearInterval(pckTicker);
      fail(/HTTP|fetch|network|Load failed/i.test(String(e && e.message)) ? L.net : L.fail, e);
    });

  playBtn.addEventListener("click", function () {
    if (playBtn.disabled || started) return;
    playBtn.disabled = true;
    playBtn.textContent = L.starting;
    started = true;
    fitCanvas();
    engine.start({ args: ["--main-pack", PCK_FILE] }).then(function () {
      cover.hidden = true;
      canvas.focus({ preventScroll: true });
      fitCanvas();
    }, function (e) {
      started = false;
      fail(L.fail, e);
    });
  });
}());
</script>
